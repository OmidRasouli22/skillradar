# Checks every push to main and every pull request.
# Actions are pinned to a commit; Dependabot keeps the pins up to date.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.23"

jobs:
  python:
    name: Python and dbt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check --output-format=github .

      - name: Format
        run: uv run --frozen ruff format --check .

      # The transform tests run the real dbt project on small test data.
      - name: Tests
        run: uv run --frozen pytest -ra

  web:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The same build that goes to GitHub Pages.
      - name: Build public site
        run: npm run build:public

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc

      - name: Python packages
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" \
            --require-hashes --disable-pip --progress-spinner off

      # Any known issue in what the site ships fails; for build tools only high or worse.
      - name: npm packages
        working-directory: web
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high
