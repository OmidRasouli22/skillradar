# Weekly update pull requests, grouped so there are few of them.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]
    # typescript-eslint does not support TypeScript 7 yet. Remove this when it does.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
