# Skill list. Every way a posting writes a skill maps to one name.
#
#   name:      the name shown in the app
#   category:  one of the categories below
#   aliases:   other spellings; case, spaces and hyphens do not matter
#   ambiguous: true if the name is also a normal word ("REST", "Go"). Keyword search then
#              only uses the aliases; the LLM decides from context.

categories:
  language: Programming languages
  data: Data engineering
  database: Databases
  cloud: Cloud
  devops: DevOps and infrastructure
  ml: Machine learning and AI
  analytics: BI and analytics
  frontend: Frontend
  backend: Backend frameworks
  architecture: APIs and architecture
  mobile: Mobile
  testing: Testing
  security: Security
  enterprise: Enterprise software
  engineering: Embedded and engineering
  method: Methods and tools

