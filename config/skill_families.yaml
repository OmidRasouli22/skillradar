# How skills stand in for each other in the CV gap analysis. Every name must be a skill
# name from config/skills.yaml; a test checks this.
#
# implies: a skill that proves a broader one. A CV with AWS has Cloud Computing, a CV
#          with PostgreSQL has SQL. The broader skill counts as fully covered.
#
# families: skills that can largely replace each other, e.g. one cloud platform for
#           another. A posting that asks for Azure is partly covered by AWS. How much
#           is learned from the postings: skills that appear in the same kind of jobs
#           count more (see skillradar.cv.similarity). Never more than half.
#
# Skills that only appear together (Python and SQL, Docker and Kubernetes) are not
# listed here: knowing one does not mean knowing the other.

implies:
  Cloud Computing: [AWS, Azure, GCP, OpenStack]
  Containers: [Docker, Kubernetes, OpenShift, Rancher]
  Kubernetes: [OpenShift, Rancher]
  Infrastructure as Code: [Terraform, Pulumi, Bicep, Ansible, Puppet]
  CI/CD: [Jenkins, GitLab CI, GitHub Actions, Azure DevOps, ArgoCD]
  GitOps: [ArgoCD]
  SQL: [PostgreSQL, MySQL, MariaDB, Oracle Database, SQL Server, SQLite, DB2, SAP HANA, Snowflake, BigQuery, Redshift, DuckDB]
  NoSQL: [MongoDB, Cassandra, DynamoDB, Cosmos DB, Neo4j, Redis]
  Data Warehouse: [Snowflake, BigQuery, Redshift, Synapse, SAP BW]
  Data Lake: [Delta Lake, Iceberg]
  ETL: [Airflow, dbt, Talend, Informatica, SSIS, Azure Data Factory, AWS Glue, Dagster, Prefect, NiFi, Fivetran, Airbyte]
