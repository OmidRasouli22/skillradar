# Skill extraction with Claude.

model: claude-haiku-5-5
effort: low          # low | medium | high; extraction is a simple task
max_tokens: 3000     # includes the model's thinking; longest answer so far: 2153
batch_limit: 2000    # most postings in one batch
# Spending cap in USD per calendar month (UTC), for all Claude calls from SkillRadar.
# Checked with the worst case before anything is sent. 2.00 USD + 19% VAT is about 2 EUR.
monthly_budget_usd: 2.00
# Send new open postings to Claude in the daily job (skillradar-daily).
daily: true

# USD per million tokens at normal price. Batch requests cost half.
prices:
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50}
