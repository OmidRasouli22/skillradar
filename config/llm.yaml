# Skill extraction with Claude.

model: claude-opus-5-5
effort: low          # low | medium | high; extraction is a simple task
max_tokens: 8000     # includes the model's thinking
batch_limit: 2000    # most postings in one batch

# USD per million tokens at normal price. Batch requests cost half.
prices:
  claude-opus-5-5: {input: 4.00, output: 20.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00}
  claude-haiku-5-5: {input: 0.10, output: 0.50}
