version: 2

models:
  - name: gold_scope
    description: >
      Open tech postings with an answer from Claude, one row per posting, role and region.
      role and region can be 'all'. Postings that are not tech work (not_tech) are left out.
    columns:
      - name: refnr
        data_tests: [not_null]
      - name: role
        data_tests: [not_null]
      - name: region
        data_tests: [not_null]

  - name: gold_skill_demand
    description: >
      Per role, region and skill: how many open postings ask for the skill (postings), how
      many require it (required_postings), all postings in the group (total_postings) and
      postings / total_postings (share). Small groups give noisy shares, so always show
      total_postings. Product names that are not in the posting text are left out.
    columns:
      - name: skill
        data_tests: [not_null]
      - name: share
        data_tests: [not_null]

  - name: gold_skill_weekly
    description: >
      Skill demand per week (week_start, a Monday), role and region: the history for
      trends and forecasts. A posting counts in each week it was open on at least one day.
      A skill a group ever asked for has a row in every week the group had postings, with
      postings = 0 when nobody asked for it. Check coverage in gold_weeks first.
    columns:
      - name: week_start
        data_tests: [not_null]
      - name: role
        data_tests: [not_null]
      - name: region
        data_tests: [not_null]
      - name: skill
        data_tests: [not_null]
      - name: share
        data_tests: [not_null]

  - name: gold_weeks
    description: >
      One row per week with snapshots: days with data, whether the week is over, open
      postings (without apprenticeships), how many have an answer from Claude, how many of
      those are tech jobs, and answered / open (coverage).
    columns:
      - name: week_start
        data_tests: [unique, not_null]
      - name: coverage
        data_tests: [not_null]

  - name: gold_attribute_shares
    description: >
      Per role and region: how open postings split by seniority, remote (home office),
      german and english (language level, or 'not asked').
    columns:
      - name: attribute
        data_tests:
          - accepted_values:
              arguments:
                values: [seniority, remote, german, english]
      - name: value
        data_tests: [not_null]

  - name: gold_emerging_share
    description: >
      Per role and region: open postings that ask for at least one skill that only became
      mainstream in 2022 or later (emerging in config/skills.yaml), and their share.
    columns:
      - name: role
        data_tests: [not_null]
      - name: region
        data_tests: [not_null]
      - name: share
        data_tests: [not_null]

  - name: gold_postings
    description: >
      One row per open tech posting with an answer from Claude, for the job list and the
      job view: title, employer, first place, role, seniority, home office and language
      levels ('not asked' when the posting does not mention the language).
    columns:
      - name: refnr
        data_tests:
          - unique
          - not_null
      - name: title
        data_tests: [not_null]
      - name: role
        data_tests: [not_null]

  - name: gold_posting_skills
    description: The skills each posting is counted for (made-up product names left out).
    columns:
      - name: refnr
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('gold_postings')
                field: refnr
      - name: skill
        data_tests: [not_null]

  - name: gold_posting_texts
    description: The cleaned text of each posting in gold_postings, contact details removed.
    columns:
      - name: refnr
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('gold_postings')
                field: refnr

  - name: gold_meta
    description: >
      Date of the newest snapshot (as_of), open postings without apprenticeships, how many
      of them have an answer, how many of those are tech jobs (tech_postings, the base of
      every share), and the model and prompt version behind the answers.
