version: 2

models:
  - name: silver_postings
    description: One clean row per posting, from the newest details record.
    columns:
      - name: refnr
        data_tests: [unique, not_null]
      - name: posting_type
        data_tests:
          - accepted_values:
              arguments:
                values: [ARBEIT, SELBSTAENDIGKEIT, AUSBILDUNG, PRAKTIKUM_TRAINEE]
              config:
                severity: warn
      - name: first_published
        description: First publish date from the API. Used for history before our first snapshot.
        data_tests: [not_null]

  - name: silver_posting_texts
    description: >
      Descriptions with emails, phone numbers, links and contact names replaced by
      [email], [phone], [link] and [name]. The other columns count the replacements.
    columns:
      - name: refnr
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_postings')
                field: refnr
      - name: description
        data_tests: [not_null]

  - name: silver_posting_locations
    description: One row per posting and location.
    columns:
      - name: refnr
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_postings')
                field: refnr
      - name: position
        description: Order of the location in the posting, starting at 1.
        data_tests: [not_null]

  - name: silver_posting_days
    description: One row per posting and day it was open in our snapshots.
    columns:
      - name: snapshot_date
        data_tests: [not_null]
      - name: refnr
        data_tests: [not_null]

  - name: silver_posting_history
    description: >
      First and last day each posting was seen, and the first complete day it was gone.
      closed_on is empty while the posting is still open.
    columns:
      - name: refnr
        data_tests: [unique, not_null]
      - name: first_seen
        data_tests: [not_null]
      - name: last_seen
        data_tests: [not_null]
      - name: is_open
        data_tests: [not_null]
