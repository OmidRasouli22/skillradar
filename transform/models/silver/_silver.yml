version: 2

models:
  - name: silver_postings
    description: One clean row per posting, from the newest details record.
    columns:
      - name: refnr
        data_tests: [unique, not_null]
      - name: posting_type
        data_tests:
          - accepted_values:
              arguments:
                values: [ARBEIT, SELBSTAENDIGKEIT, AUSBILDUNG, PRAKTIKUM_TRAINEE]
              config:
                severity: warn
      - name: first_published
        description: First publish date from the API. Used for history before our first snapshot.
        data_tests: [not_null]

  - name: silver_posting_texts
    description: >
      Descriptions with emails, phone numbers, links and contact names replaced by
      [email], [phone], [link] and [name]. The other columns count the replacements.
    columns:
      - name: refnr
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_postings')
                field: refnr
      - name: description
        data_tests: [not_null]

  - name: silver_posting_locations
    description: One row per posting and location.
    columns:
      - name: refnr
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_postings')
                field: refnr
      - name: position
        description: Order of the location in the posting, starting at 1.
        data_tests: [not_null]

  - name: silver_posting_days
    description: One row per posting and day it was open in our snapshots.
    columns:
      - name: snapshot_date
        data_tests: [not_null]
      - name: refnr
        data_tests: [not_null]

  - name: silver_posting_history
    description: >
      First and last day each posting was seen, and the first complete day it was gone.
      closed_on is empty while the posting is still open.
    columns:
      - name: refnr
        data_tests: [unique, not_null]
      - name: first_seen
        data_tests: [not_null]
      - name: last_seen
        data_tests: [not_null]
      - name: is_open
        data_tests: [not_null]

  - name: silver_posting_extractions
    description: >
      Role, seniority and remote per posting from Claude. Only answers to the current
      model and prompt version, so all rows come from the same instructions.
    columns:
      - name: refnr
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_postings')
                field: refnr
      - name: role
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [data_engineer, data_scientist, data_analyst, ml_engineer,
                         backend_developer, frontend_developer, fullstack_developer,
                         mobile_developer, devops_engineer, embedded_engineer,
                         software_engineer, it_security, it_administration, sap_erp,
                         it_project_manager, other_tech, not_tech]
      - name: seniority
        data_tests:
          - accepted_values:
              arguments:
                values: [student, junior, mid, senior, lead, unknown]
      - name: remote
        data_tests:
          - accepted_values:
              arguments:
                values: [onsite, hybrid, remote, unknown]

  - name: silver_posting_skills
    description: >
      One row per posting and skill. skill is the name from config/skills.yaml when it is
      in the list. in_text is false when the posting does not name the skill or one of its
      spellings: fine for general skills ("Networking" for "Netzwerk"), but a product name
      that is not in the text was most likely added by the model.
    columns:
      - name: refnr
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_posting_extractions')
                field: refnr
      - name: skill
        data_tests: [not_null]
      - name: required
        data_tests: [not_null]
      - name: general
        description: True for a concept ("Networking"), false for a product or an unknown skill.
        data_tests: [not_null]
      - name: emerging
        description: True for skills that only became mainstream in 2022 or later.
        data_tests: [not_null]
      - name: in_text
        data_tests: [not_null]

  - name: silver_posting_languages
    description: Human languages a posting asks for, with the level, in English names.
    columns:
      - name: refnr
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_posting_extractions')
                field: refnr
      - name: level
        data_tests:
          - accepted_values:
              arguments:
                values: [basic, good, fluent, native, unknown]
